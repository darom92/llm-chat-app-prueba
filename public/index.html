<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Asistente WorkinBrands</title>
		<style>
			:root {
				--bg-1: #0b0b1e;
				--bg-2: #14123a;
				--card-top: #1e1b4f;
				--card-bottom: #120f35;
				--layer-1: #2b2191;
				--layer-2: #3a2cb0;
				--border: rgba(255, 255, 255, 0.1);
				--text: #f1f5f9;
				--muted: #a5b4fc;
				--accent: #38bdf8;
				--chip-bg: #121b47;
				--chip-border: #1f4f7a;
				--chip-text: #7dd3fc;
				--bubble-bg: rgba(255, 255, 255, 0.08);
				--user-bg: #2563eb;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px 16px;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
				color: var(--text);
				background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
			}

			.widget {
				position: relative;
				width: min(440px, 100%);
				border-radius: 22px;
				background: linear-gradient(180deg, var(--card-top), var(--card-bottom));
				border: 1px solid var(--border);
				box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
				overflow: hidden;
				isolation: isolate;
			}

			/* Capas de color detrás de la tarjeta */
			.widget::before,
			.widget::after {
				content: "";
				position: absolute;
				inset: 0;
				border-radius: 22px;
				z-index: -1;
			}
			.widget::before {
				background: var(--layer-1);
				transform: translate(10px, 10px);
			}
			.widget::after {
				background: var(--layer-2);
				transform: translate(20px, 20px);
			}

			header {
				display: flex;
				align-items: center;
				gap: 14px;
				padding: 18px;
				border-bottom: 1px solid var(--border);
			}

			.avatar {
				position: relative;
				width: 50px;
				height: 50px;
				flex-shrink: 0;
				border-radius: 50%;
				display: grid;
				place-items: center;
				background: linear-gradient(135deg, #38bdf8, #1d4ed8);
				color: #fff;
				font-weight: 700;
				font-size: 16px;
			}

			.status-dot {
				position: absolute;
				right: -2px;
				bottom: -2px;
				width: 16px;
				height: 16px;
				border-radius: 50%;
				background: #22c55e;
				border: 3px solid var(--card-top);
			}

			.header-text h1 {
				font-size: 17px;
				font-weight: 700;
			}

			.header-text p {
				font-size: 14px;
				color: var(--muted);
				margin-top: 2px;
			}

			.messages {
				height: 340px;
				overflow-y: auto;
				padding: 18px;
				display: flex;
				flex-direction: column;
				gap: 12px;
			}

			.message {
				max-width: 85%;
				padding: 14px 16px;
				border-radius: 16px;
				font-size: 15px;
				line-height: 1.5;
				background: var(--bubble-bg);
				border: 1px solid rgba(255, 255, 255, 0.12);
			}

			.message p {
				white-space: pre-line;
				overflow-wrap: anywhere;
			}

			.user-message {
				align-self: flex-end;
				background: var(--user-bg);
				border-color: transparent;
				color: #fff;
			}

			.assistant-message {
				align-self: flex-start;
			}

			.typing-indicator {
				display: none;
				padding: 0 18px 10px;
				font-size: 13px;
				color: var(--muted);
			}

			.typing-indicator.visible {
				display: block;
			}

			.suggestions {
				padding: 16px 18px;
				border-top: 1px solid var(--border);
			}

			.suggestions-label {
				font-size: 14px;
				color: var(--muted);
				margin-bottom: 10px;
			}

			.chips {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
			}

			.chip {
				font: inherit;
				font-size: 14px;
				font-weight: 700;
				text-align: left;
				padding: 12px 14px;
				border-radius: 12px;
				border: 1.5px solid var(--chip-border);
				background: var(--chip-bg);
				color: var(--chip-text);
				cursor: pointer;
				transition: background 0.2s;
			}

			.chip:hover:not(:disabled) {
				background: #1a2760;
			}

			.chip:disabled {
				opacity: 0.6;
				cursor: not-allowed;
			}

			.input-row {
				display: flex;
				gap: 8px;
				padding: 14px 18px;
				border-top: 1px solid var(--border);
			}

			#user-input {
				flex: 1;
				font: inherit;
				font-size: 15px;
				color: var(--text);
				background: rgba(255, 255, 255, 0.06);
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-radius: 12px;
				padding: 12px 14px;
				resize: none;
				min-height: 46px;
			}

			#user-input::placeholder {
				color: #7c83b5;
			}

			#send-button {
				font: inherit;
				font-weight: 700;
				padding: 0 18px;
				border: none;
				border-radius: 12px;
				background: var(--accent);
				color: #0b1020;
				cursor: pointer;
			}

			#send-button:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			@media (max-width: 480px) {
				.widget::before,
				.widget::after {
					display: none;
				}
				.chips {
					grid-template-columns: 1fr;
				}
				.messages {
					height: 300px;
				}
			}
		</style>
	</head>
	<body>
		<div class="widget">
			<header>
				<div class="avatar">
					IA
					<span class="status-dot"></span>
				</div>
				<div class="header-text">
					<h1>Asistente WorkinBrands</h1>
					<p>Disponible las 24 horas</p>
				</div>
			</header>

			<div id="chat-messages" class="messages">
				<div class="message assistant-message">
					<p>¡Hola! Soy el asistente de WorkinBrands. ¿En qué puedo ayudarte?</p>
				</div>
			</div>

			<div class="typing-indicator" id="typing-indicator">Escribiendo…</div>

			<div class="suggestions">
				<p class="suggestions-label">Pulsa una pregunta para empezar:</p>
				<div class="chips">
					<button class="chip" data-question="¿Cómo me ayuda a vender?">¿Cómo me ayuda a vender?</button>
					<button class="chip" data-question="¿Atiende 24/7?">¿Atiende 24/7?</button>
					<button class="chip" data-question="¿Sirve para mi negocio?">¿Sirve para mi negocio?</button>
					<button class="chip" data-question="¿Cómo lo instalan?">¿Cómo lo instalan?</button>
				</div>
			</div>

			<div class="input-row">
				<textarea
					id="user-input"
					placeholder="Escribe tu pregunta…"
					rows="1"
				></textarea>
				<button id="send-button">Enviar</button>
			</div>
		</div>

		<script src="chat.js"></script>
	</body>
</html>
